services:
  database:
    image: mysql:8.4
    container_name: fullstack-mysql
    environment:
      MYSQL_DATABASE: fullstack_auth
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: fullstack-backend:1.0
    container_name: fullstack-backend
    environment:
      DB_URL: jdbc:mysql://database:3306/fullstack_auth
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8086:8085"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: fullstack-frontend:1.2
    container_name: fullstack-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql_data:
